# This workflow lives under .github/workflows/**, which is a CONTROL_PATH.
# A PR that changes it must not also change unrelated application code.
name: control-guard

on:
  pull_request:

jobs:
  control-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Check control-file isolation
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: devflow ci-checks --base "${BASE_REF}"
